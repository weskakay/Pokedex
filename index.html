<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="colors.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <header>
        <a href="/index.html" id="header-container">
            <img src="/assets/icon/pokeball_logo.png" alt="Pokedex Logo" id="logo" />
            <h1>Pokedex</h1>
        </a>
        <input type="text" id="search" placeholder="Suche Pokémon..." />
    </header>
    
    <main>
        <div id="loading-screen" class="hidden">
            <img src="/assets/icon/pokeball_logo.png" alt="Loading..." />
            <p>Loading...</p>
        </div>
        <section id="pokemon-container"></section>
        <div id="filter-container">
            <label for="filter">Pokémon-Anzahl:</label>
            <select id="filter">
                <option value="10" selected>10</option>
                <option value="20" >20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
            </select>
        </div>
        <button id="load-more">Mehr Pokemon laden</button>
    </main>
    <footer>
        <p>&copy; KW - 2025 Pokedex</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
